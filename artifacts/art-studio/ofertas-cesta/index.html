<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Ofertas — cesta vermelha</title><style>body{margin:0;background:#eeeae2;color:#24362d;font:15px system-ui}header{padding:32px 40px;background:#173f35;color:#f6f1de}h1{margin:0;font-size:32px}p{opacity:.75}section{padding:22px 30px;border-bottom:1px solid #c8c7bb}h2{font-size:20px}.row{display:flex;align-items:flex-start;gap:18px;overflow:auto}.item{background:white;padding:10px;flex:none}small{display:block;margin-bottom:10px}a{color:inherit}canvas{display:block}#status{font-weight:bold}</style><header><h1>Ofertas — cesta vermelha</h1><p>5 formatos · Textos, desconto, cores e logo editáveis</p><div id="status">Carregando prévias em Fabric…</div></header><main id="content"></main><script type="module">
import {Gradient,StaticCanvas,Textbox,Rect,Ellipse,FabricImage,Path} from 'fabric'
const root=document.querySelector('#content');let rendered=0;window.reviewErrors=[]
for(const family of ['Barlow','BarlowCondensed'])for(const [weight,name]of [[400,'Regular'],[600,'SemiBold'],[700,'Bold'],[800,'ExtraBold']]){const f=new FontFace(family==='Barlow'?'Barlow':'Barlow Condensed',`url(/public/art-studio/fonts/${family}-${name}.ttf)`,{weight:String(weight)});await f.load();document.fonts.add(f)}
const f=new FontFace('Anton','url(/public/art-studio/fonts/Anton-Regular.ttf)');await f.load();document.fonts.add(f)
const manifest=await (await fetch('./manifest.json')).json()
for(const [family,file,weight]of [['Montserrat','Montserrat[wght].ttf','100 900'],['Patua One','PatuaOne-Regular.ttf','400'],['Consumidor Referencia','ConsumidorReferencia-Regular.ttf','400'],['Russo One','RussoOne-Regular.ttf','400'],['Roboto Slab','RobotoSlab[wght].ttf','100 900'],['Audiowide','Audiowide-Regular.ttf','400'],['Bebas Neue','BebasNeue-Regular.ttf','400'],['Caveat','Caveat[wght].ttf','400 700']]){const f=new FontFace(family,`url(/public/art-studio/fonts/${encodeURIComponent(file)})`,{weight});await f.load();document.fonts.add(f)}
const gradient=g=>{const colorStops=[{offset:0,color:g.from+Math.round(g.startOpacity*255).toString(16).padStart(2,'0')},{offset:1,color:g.to+Math.round(g.endOpacity*255).toString(16).padStart(2,'0')}];return new Gradient({type:g.type,gradientUnits:'percentage',coords:g.type==='radial'?{x1:.5,y1:.5,r1:0,x2:.5,y2:.5,r2:.5}:{x1:.5-Math.cos(g.angle*Math.PI/180)/2,y1:.5-Math.sin(g.angle*Math.PI/180)/2,x2:.5+Math.cos(g.angle*Math.PI/180)/2,y2:.5+Math.sin(g.angle*Math.PI/180)/2},colorStops})}
const heart='M 50 88 C 0 55 0 12 27 12 C 40 12 48 22 50 28 C 52 22 60 12 73 12 C 100 12 100 55 50 88 Z'
if(manifest.deletedAt){document.querySelector('#status').textContent='Coleção excluída a pedido do usuário.'}
for(let i=1;!manifest.deletedAt&&i<=1;i++){
 const template=await (await fetch('./modelo.json')).json();const sec=document.createElement('section');sec.id='model-'+i;sec.innerHTML=`<h2>${i}. ${template.name}</h2><div class="row"></div>`;root.append(sec)
 for(const doc of [template.composition,...(template.composition.alternates||[])]){
  const el=document.createElement('div');el.className='item';el.innerHTML=`<small>${doc.width} × ${doc.height}</small><canvas></canvas>`;sec.querySelector('.row').append(el)
  const scale=doc.width>doc.height?400/doc.width:Math.min(390,window.innerWidth-70)/doc.width;const c=new StaticCanvas(el.querySelector('canvas'),{width:doc.width*scale,height:doc.height*scale,backgroundColor:doc.background,renderOnAddRemove:false});c.setZoom(scale)
  for(const l of doc.layers){const o={left:l.x,top:l.y,originX:'left',originY:'top',angle:l.rotation,opacity:l.opacity,fill:l.gradient?gradient(l.gradient):l.fill,strokeWidth:0};let obj
   if(l.kind==='text'){obj=new Textbox(l.text,{...o,width:l.width/(l.fontScaleX||1),scaleX:l.fontScaleX||1,fontFamily:l.fontFamily,fontSize:l.fontSize,fontWeight:l.fontWeight,lineHeight:l.lineHeight??1.16,textAlign:l.align||'left'});while(obj.height>l.height&&obj.fontSize>6){obj.set('fontSize',obj.fontSize-1);obj.initDimensions()}}
   else if(l.kind==='image'){if(!l.src){obj=new Textbox('SUA LOGO',{...o,width:l.width,fontFamily:'Barlow',fontSize:38*doc.width/1080,textAlign:'center'});obj.set('top',l.y+l.height*.35)}else{const im=await FabricImage.fromURL('./cesta-reta.png');const fit=l.fit==='cover'?Math.max(l.width/im.width,l.height/im.height):Math.min(l.width/im.width,l.height/im.height);im.set({...o,scaleX:fit,scaleY:fit});if(l.fit==='cover'){const cw=l.width/fit,ch=l.height/fit;im.set({width:cw,height:ch,cropX:(im.width-cw)*.5,cropY:(im.height-ch)*(l.cropY??.5)})}else im.set({left:l.x+(l.width-im.width*fit)/2,top:l.y+(l.height-im.height*fit)/2});obj=im}}
   else if(l.kind==='shape'&&l.shape==='path'){obj=new Path(l.pathData,o);obj.set({scaleX:l.width/obj.width,scaleY:l.height/obj.height})}
   else if(l.kind==='icon'){obj=new Path(heart,o);obj.set({scaleX:l.width/obj.width,scaleY:l.height/obj.height})}
   else obj=l.shape==='ellipse'?new Ellipse({...o,rx:l.width/2,ry:l.height/2}):new Rect({...o,width:l.width,height:l.height,rx:l.cornerRadius||0,ry:l.cornerRadius||0})
   if(l.blur&&['shape','icon'].includes(l.kind)){obj.set({left:0,top:0,angle:0,opacity:1});const pad=Math.ceil(l.blur*3);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${l.width+pad*2}" height="${l.height+pad*2}" viewBox="${-pad} ${-pad} ${l.width+pad*2} ${l.height+pad*2}"><defs><filter id="b" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="${l.blur}"/></filter></defs><g filter="url(#b)">${obj.toSVG()}</g></svg>`;const im=await FabricImage.fromURL('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));obj.dispose();const a=l.rotation*Math.PI/180;im.set({...o,left:l.x-pad*Math.cos(a)+pad*Math.sin(a),top:l.y-pad*Math.sin(a)-pad*Math.cos(a)});obj=im}
   c.add(obj)
  }
  c.renderAll();rendered++;document.querySelector('#status').textContent=`${rendered}/5 formatos renderizados no Fabric`;window.renderedCount=rendered
 }
}
</script></html>
